name: Check upstream settings drift

# Detects when jellyfin-web / jellyfin upstream renames a key, flips a setting
# between localStorage and server-side DisplayPreferences/UserConfiguration, or
# removes something this plugin depends on. See
# .github/scripts/check_upstream_settings.py for the full rationale -- this is
# exactly the class of bug that silently broke the
# useEpisodeImagesInNextUpAndResume tweak for years.

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run drift check
        id: drift
        run: python3 .github/scripts/check_upstream_settings.py

      - name: Open or update tracking issue on drift
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream settings drift detected';
            const body = [
              'The scheduled `check-upstream-settings` workflow found that jellyfin-web or jellyfin',
              'upstream has changed something this plugin depends on (a key was renamed/removed, a',
              'setting moved between localStorage and server-side storage, or a default changed).',
              '',
              `See the failed run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Once the affected tweak(s) in `applyTweaks.js` / `PluginConfiguration.cs` are fixed,',
              'update `.github/upstream-snapshots/expected-settings-manifest.json` to match the new',
              'upstream reality and close this issue.'
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'upstream-drift'
            });
            const found = existing.find(issue => issue.title === title);

            if (found) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: found.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['upstream-drift']
              });
            }
